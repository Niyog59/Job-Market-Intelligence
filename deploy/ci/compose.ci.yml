# CI only, layered on docker-compose.yml: a fake S3 (moto) so the real pipeline can upload
# and confirm backups and raw files without AWS, and DAGs kept paused so nothing runs on its
# own while CI drives each run explicitly. Throwaway credentials only.
services:
  moto:
    image: motoserver/moto:5.2.4

  airflow-scheduler:
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: ci-only
      AWS_SECRET_ACCESS_KEY: ci-only
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

  airflow-dag-processor:
    environment:
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

  airflow-api:
    environment:
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

  jobs:
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: ci-only
      AWS_SECRET_ACCESS_KEY: ci-only
