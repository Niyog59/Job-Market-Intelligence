# Production stack for one server: PostgreSQL, the website (gunicorn), Caddy (HTTPS), and
# Airflow (scheduler, DAG processor, API server) running the pipeline on a schedule.
# Run every command from this directory, with a .env file made from env.example
# (see RUNBOOK.md). Only Caddy publishes public ports (80 and 443). The Airflow UI listens on
# the server's loopback address only (reach it through an SSH or Session Manager tunnel);
# the database and the website are reachable only from the other containers.
name: jobmarket

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: jobmarket-app:${APP_VERSION:-local}
  logging: *logging
  security_opt:
    - no-new-privileges:true
  depends_on:
    db:
      condition: service_healthy

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "1"
  AIRFLOW__CORE__DEFAULT_POOL_TASK_SLOT_COUNT: "1"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_FOLDER: /app/deploy/airflow/dags
  AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Chicago
  # New DAGs start active: the first scheduler start makes one fresh collection.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
  AIRFLOW__API__WORKERS: "1"
  AIRFLOW__API__EXPOSE_CONFIG: "False"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
  AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "2"
  AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "3"
  # Read where the DAG file is parsed (the DAG processor), so it is set for every Airflow
  # service; empty means the default in the DAG file (8,12,21).
  JOBMARKET_COLLECTION_HOURS: ${JOBMARKET_COLLECTION_HOURS:-}

x-airflow: &airflow
  <<: *app
  restart: unless-stopped
  environment: *airflow-env
  volumes:
    - airflowdata:/app/airflow

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    logging: *logging
    # Memory settings for a 1 GiB server (see SIZING.md).
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      # Airflow holds a few connections per component (pools set below); 20 was too few.
      - max_connections=40
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read once, by postgres-init/10-jobmarket.sh, when the volume is first created.
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env}
      PRIVATE_DB_PASSWORD: ${PRIVATE_DB_PASSWORD:?set PRIVATE_DB_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: the temporary server that runs the init scripts listens only on a socket,
      # so this passes only once the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    <<: *app
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "jobmarket.web.wsgi:app"]
    # Only the logins the website uses: never the ingestion owner or the superuser.
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      PRIVATE_DB_PASSWORD: ${PRIVATE_DB_PASSWORD}
      WEB_TRUST_PROXY: "1"
      # The published Tableau Public workbook for Market insights (empty until published).
      JOBMARKET_TABLEAU_WORKBOOK: ${JOBMARKET_TABLEAU_WORKBOOK:-}
      JOBMARKET_TABLEAU_PROFILE: ${JOBMARKET_TABLEAU_PROFILE:-}
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:---workers 1 --threads 4}
      JOBMARKET_PUBLIC_DIR: /app/public
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Only the public numbers file (profile-stats.json) the publication writes; read-only.
      - publicdata:/app/public:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Airflow. One task at a time across every DAG (PARALLELISM=1), so the pipeline never
  # competes with itself for the server's memory; tasks run inside the scheduler container
  # (LocalExecutor) as `jobmarket` commands. Run history lives in the separate "airflow"
  # database; logs and generated files in the airflowdata volume.
  airflow-scheduler:
    <<: *airflow
    command: ["airflow", "scheduler"]
    # The pipeline's tasks need the application's settings (database, S3, email, Gemini).
    env_file: .env
    environment:
      <<: *airflow-env
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ""  # the superuser password is not needed here
      # Only for the daily `airflow db clean` task (Airflow blocks its own database inside
      # tasks; see the DAG file).
      JOBMARKET_AIRFLOW_DB_URL: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@db:5432/airflow
      JOBMARKET_PUBLIC_DIR: /app/public
    volumes:
      - appdata:/app/data
      - airflowdata:/app/airflow
      - publicdata:/app/public
      # The Google service account key for the dashboard Sheet (git-ignored; README inside).
      - ./secrets:/app/secrets:ro

  airflow-dag-processor:
    <<: *airflow
    command: ["airflow", "dag-processor"]

  airflow-api:
    <<: *airflow
    command: ["airflow", "api-server", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"  # loopback only: never reachable from the internet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  # One-shot: create or upgrade Airflow's tables. docker compose run --rm airflow-init
  airflow-init:
    <<: *airflow
    profiles: ["init"]
    restart: "no"
    command: ["airflow", "db", "migrate"]

  # The extraction worker: sends new listings to Gemini within minutes of their collection,
  # with the same queue, limits, and checks as `jobmarket extract run`. Started only with
  # the "worker" profile (COMPOSE_PROFILES=worker in .env); while it runs, the hourly batch
  # in Airflow skips itself, and it runs again once the worker is stopped (RUNBOOK
  # section W). It needs only the database and the Gemini settings.
  extract-worker:
    <<: *app
    profiles: ["worker"]
    restart: unless-stopped
    command: ["jobmarket", "extract", "worker"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ""  # the superuser password is not needed here
    # On stop, a request already sent may take up to its 120-second time limit; this leaves
    # time for it to finish and be recorded before Docker kills the process.
    stop_grace_period: 150s
    mem_limit: 256m  # decision 2026-11-05; measured in CI (deploy job) and in SIZING.md
    read_only: true
    tmpfs:
      - /tmp

  # Command-line jobs, run by hand: docker compose run --rm jobs jobmarket <command>.
  # Never started by `docker compose up`.
  jobs:
    <<: *app
    profiles: ["jobs"]
    restart: "no"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ""  # the superuser password is not needed here
      JOBMARKET_PUBLIC_DIR: /app/public
    volumes:
      - appdata:/app/data
      - publicdata:/app/public
      - ./secrets:/app/secrets:ro

volumes:
  pgdata:
  appdata:
  publicdata:
  airflowdata:
  caddy_data:
  caddy_config:
