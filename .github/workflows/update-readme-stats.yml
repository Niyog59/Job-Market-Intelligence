name: Update README live numbers

# Runs after the profile repo's stats update (04:30 / 14:30 UTC),
# plus a manual option. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 5 * * *"    # 05:00 UTC, after the evening publish + profile update
    - cron: "0 15 * * *"   # 15:00 UTC morning catch-up
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live stats and rewrite README numbers
        run: python3 scripts/update_readme_stats.py

      - name: Commit only if the numbers changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh live numbers in README"
            git push
          else
            echo "Numbers unchanged, no commit."
          fi
