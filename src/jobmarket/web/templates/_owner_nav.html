<nav class="owner-nav" aria-label="Site">
  <a href="{{ url_for('newest') }}"{% if request.endpoint == 'newest' %} aria-current="page"{% endif %}>Newest jobs</a>
  <a href="{{ url_for('results') }}"{% if request.endpoint == 'results' %} aria-current="page"{% endif %}>Job search</a>
  <a href="{{ url_for('employers') }}"{% if request.endpoint == 'employers' %} aria-current="page"{% endif %}>Employers</a>
  <a href="{{ url_for('insights_page') }}"{% if request.endpoint == 'insights_page' %} aria-current="page"{% endif %}>Market insights</a>
  <a href="{{ url_for('reports_page') }}"{% if request.endpoint == 'reports_page' %} aria-current="page"{% endif %}>Reports</a>
  {% if owner %}
  <a href="{{ url_for('profile') }}"{% if request.endpoint == 'profile' %} aria-current="page"{% endif %}>Profile</a>
  <a href="{{ url_for('saved_jobs') }}"{% if request.endpoint == 'saved_jobs' %} aria-current="page"{% endif %}>Saved jobs</a>
  <a href="{{ url_for('applications') }}"{% if request.endpoint == 'applications' %} aria-current="page"{% endif %}>Applications</a>
  <form method="post" action="{{ url_for('sign_out') }}" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ owner.csrf_token }}">
    <button class="link-button" type="submit">Sign out</button>
  </form>
  {% else %}
  <a href="{{ url_for('sign_in', next=request.full_path.rstrip('?')) }}">Sign in</a>
  {% endif %}
</nav>
