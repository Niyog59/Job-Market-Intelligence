version: 2

models:
  - name: rpt_daily_activity
    description: "Grain: one row per reporting day per population ('all', 'retained'). Initial imports, discoveries (first observed by the pipeline after the board's baseline), updates (content changes), availability transitions, and board coverage. Today is provisional (is_complete = false)."
    data_tests:
      - unique_combination: {arguments: {columns: ['report_day', 'population']}}
    columns:
      - name: population
        data_tests:
          - accepted_values: {arguments: {values: ['all', 'retained']}}

  - name: rpt_inventory_daily
    description: "Grain: one row per reporting day per population per availability state, as known at the end of that day. source_records counts postings; opportunities counts duplicate groups once."
    data_tests:
      - unique_combination:
          arguments: {columns: ['report_day', 'population', 'availability_state']}
    columns:
      - name: availability_state
        data_tests:
          - accepted_values:
              arguments:
                values: ['observed', 'possibly_unavailable', 'assumed_inactive', 'closed',
                         'not_tracked']
      - name: coverage
        data_tests:
          - accepted_values:
              arguments: {values: ['tracked', 'before_availability_tracking']}

  - name: rpt_inventory_current
    description: "Grain: one row per dimension per value per population per availability state, for postings known today. Role categories and rule families overlap (categories_overlap) and cannot be summed."
    data_tests:
      - unique_combination:
          arguments: {columns: ['dimension', 'value', 'population', 'availability_state']}
    columns:
      - name: dimension
        data_tests:
          - accepted_values:
              arguments:
                values: ['employer', 'source_system', 'rule_family', 'role_category', 'place',
                         'work_arrangement', 'early_career']

  - name: rpt_skill_demand
    description: "Grain: one row per skill per requirement level per mention kind per population, over listed postings with an extraction. mention_kind 'alternative' is one of a set of choices, not an individual requirement. Rows do not sum to a posting total."
    data_tests:
      - unique_combination:
          arguments: {columns: ['skill', 'requirement', 'mention_kind', 'population']}

  - name: rpt_experience_requirements
    description: "Grain: one row per measure per value per population, over listed postings."
    data_tests:
      - unique_combination: {arguments: {columns: ['measure', 'value', 'population']}}

  - name: rpt_eligibility
    description: "Grain: one row per concept (sponsorship, work_authorization, citizenship, clearance) per status per population, over listed postings, with three denominators (listed, extracted, stating a policy)."
    data_tests:
      - unique_combination: {arguments: {columns: ['concept', 'status', 'population']}}

  - name: rpt_pipeline_health_daily
    description: "Grain: one row per reporting day: scans by outcome, boards scanned and on hold, AI requests and recorded token usage, and extraction coverage of listed retained postings."
    columns:
      - name: report_day
        data_tests: [unique, not_null]

  - name: rpt_board_freshness
    description: "Grain: one row per board: latest scan, latest complete collection and its age, baseline, and hold."
    columns:
      - name: board_id
        data_tests: [unique, not_null]

  - name: rpt_extraction_coverage
    description: "Grain: one row per population: listed postings, how many are extracted, and where the rest are in the queue."
    columns:
      - name: population
        data_tests: [unique, not_null]

  - name: rpt_build_info
    description: "Grain: exactly one row. When the reporting build ran, the newest complete collection, and the newest AI extraction it saw."
    columns:
      - name: built_at
        data_tests: [not_null]

  - name: rpt_jobs_current
    description: "Grain: one row per distinct current job (duplicates merged), listed and kept. Feeds the Tableau dashboards and the homepage numbers."
    columns:
      - name: job_key
        data_tests: [unique, not_null]
      - name: role_group
        data_tests:
          - accepted_values: {arguments: {values: ['Data', 'AI/ML', 'Software', 'Other', 'Not extracted']}}
      - name: level_ai
        data_tests:
          - accepted_values: {arguments: {values: ['Junior', 'Mid', 'Senior+', 'Unclear', 'Not extracted']}}
      - name: level_years
        data_tests:
          - accepted_values: {arguments: {values: ['0-2 years', '3-4 years', '5+ years', 'Not stated', 'Not extracted']}}
      - name: cohort
        data_tests:
          - accepted_values: {arguments: {values: ['initial_import', 'discovered']}}
      - name: genai_mention
        data_tests: [not_null]

  - name: rpt_job_skills
    description: "Grain: one row per current job per skill per requirement level, with the job's filter fields repeated."
    data_tests:
      - unique_combination: {arguments: {columns: ['job_key', 'skill', 'requirement']}}

  - name: rpt_job_genai_terms
    description: "Grain: one row per current job per generative-AI term its title or description mentions (macro genai_terms)."
    data_tests:
      - unique_combination: {arguments: {columns: ['job_key', 'term']}}

  - name: rpt_skill_pairs
    description: "Grain: one row per skill pair (skill_a < skill_b) per role group: current jobs that require or prefer both."
    data_tests:
      - unique_combination: {arguments: {columns: ['skill_a', 'skill_b', 'role_group']}}

  - name: rpt_weekly_jobs
    description: "Grain: one row per week (Monday start, America/Chicago) per level rule per level per role group per metro: new jobs (initial imports excluded) and jobs open at the week's end, with generative-AI mentions."
    data_tests:
      - unique_combination: {arguments: {columns: ['week_start', 'level_rule', 'level', 'role_group', 'metro']}}
    columns:
      - name: level_rule
        data_tests:
          - accepted_values: {arguments: {values: ['ai', 'years']}}

  - name: rpt_weekly_skills
    description: "Grain: one row per week per skill per role group: new kept jobs that week requiring the skill."
    data_tests:
      - unique_combination: {arguments: {columns: ['week_start', 'skill', 'role_group']}}

