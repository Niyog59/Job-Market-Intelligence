# Connection settings come from the environment (.env); no secrets are stored here.
job_market:
  target: analytics
  outputs:
    # The read-only analytics login: SELECT on ingestion tables, CREATE for its own schemas.
    analytics:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME') }}"
      user: "{{ env_var('ANALYTICS_DB_USER', 'jobmarket_analytics') }}"
      password: "{{ env_var('ANALYTICS_DB_PASSWORD', '') }}"
      schema: analytics
      threads: 4
    # The ingestion login, used only by tests and CI to build into throwaway schemas.
    owner:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('DB_NAME') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD', '') }}"
      schema: analytics
      threads: 4
