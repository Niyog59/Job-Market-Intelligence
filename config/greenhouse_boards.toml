# Greenhouse job boards for Dallas-Fort Worth and Greater Houston coverage.
#
# "verified" means an official employer-to-board connection was established from the
# employer's own careers source. It is not a Greenhouse certification, and it does not
# mean the board currently has relevant openings. Only verified boards are enabled.
# "pending" boards stay disabled until that connection is confirmed: a readable board or
# a matching company name is not enough.
#
# Research snapshot: 2026-10-25 (first discovery pass, not an exhaustive census).
#
# Fields
#   employer        display name of the employer or brand
#   employer_slug   stable id; boards of the same employer share it (for example BGE)
#   group           optional corporate group shared by related employers
#   token           Greenhouse board token
#   region          "us" or "eu": which human-facing board host the employer uses
#   enabled         collected by `jobmarket collect`
#   verification    "verified" | "pending"
#   metros          any of "dfw", "houston"
#   local_evidence  office or hiring evidence; not a guarantee of a relevant opening
#   official_source official careers page used as evidence (empty if not yet resolved)
#   evidence        how the official connection was established
#   checks          special review notes for screening or verification

schema_version = 1
researched_on = "2026-10-25"

