# Lever job boards for Dallas-Fort Worth and Greater Houston coverage.
#
# "verified" means three things were established: an official employer-to-board connection
# from the employer's own careers source, local hiring evidence (a DFW or Houston location on
# the board), and an answering postings API. It is not a certification by Lever and does not
# mean every posting was checked. Only verified boards are enabled. "pending" boards stay
# disabled until the missing evidence is found; a readable board or a matching name is not
# enough. "holds" are boards whose identity or scope is in doubt.
#
# Research snapshot 2026-10-26 (44 candidates: 25 verified, 18 pending, 1 held), rechecked on
# 2026-10-26 with full pagination and official careers pages. This is a discovery pass, not a census
# of the market.
#
# Fields as in greenhouse_boards.toml, plus
#   region   "global" (jobs.lever.co) or "eu" (jobs.eu.lever.co), from the official link
#   brands   hiring brands served by one shared board

source = "lever"
schema_version = 1
researched_on = "2026-10-26"

