[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Job discovery for data analyst, data engineer, and backend roles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai==2.30.1",  # pinned: official Gemini SDK, upgraded deliberately
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "moto[s3]>=5.1,<6",
    "pytest>=8",
    "ruff>=0.6",
]
# S3 storage for raw responses and backups (jobmarket sync-raw, jobmarket backup --upload).
aws = [
    "boto3>=1.40,<2",
]
# dbt models in analytics/ (jobmarket analytics build). Pinned: 1.11 needs no build-time
# downloads; upgraded deliberately.
analytics = [
    "dbt-core==1.11.16",
    "dbt-postgres==1.11.0",
]
# Three reporting models rebuilt in PySpark and compared with dbt (jobmarket spark ...). Needs
# Java 17 or 21. The export also needs the analytics extra (it compiles the dbt models). The
# website, the server image, and the scheduled pipeline never use it. Pinned: upgraded
# deliberately.
spark = [
    "pyarrow>=18,<27",
    "pyspark==4.2.0",
]
# The job-search website (jobmarket web; gunicorn on a server) and the owner account
# (Argon2id password hashing).
web = [
    "argon2-cffi>=25.1,<26",
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobmarket = [
    "migrations/*.sql",
    "web/templates/*.html",
    "web/static/*.css",
    "web/static/*.js",
    "web/static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable PostgreSQL database (configured with DB_* variables)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# A Databricks notebook: the runtime defines spark and dbutils, and the import follows sys.path.
"docs/spark/databricks_notebook.py" = ["E402", "F821"]
