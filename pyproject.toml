[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Job discovery for data analyst, data engineer, and backend roles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai==2.30.1",  # pinned: official Gemini SDK, upgraded deliberately
    "httpx>=0.28.1,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# dbt models in analytics/ (jobmarket analytics build). Pinned: 1.11 needs no build-time
# downloads; upgraded deliberately.
analytics = [
    "dbt-core==1.11.16",
    "dbt-postgres==1.11.0",
]

[project.scripts]
jobmarket = "jobmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobmarket = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a reachable PostgreSQL database (configured with DB_* variables)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
