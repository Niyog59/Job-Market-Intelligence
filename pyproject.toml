[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Job discovery for data analyst, data engineer, and backend roles."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
